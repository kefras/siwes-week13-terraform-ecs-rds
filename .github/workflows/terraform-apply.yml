name: Terraform apply after merge
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: week13-state
  cancel-in-progress: false
jobs:
  merged-pr:
    # Explicitly disabled; repository variables cannot enable deployment.
    if: ${{ false }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const {data} = await github.rest.repos.listPullRequestsAssociatedWithCommit({owner: context.repo.owner, repo: context.repo.repo, commit_sha: context.sha});
            if (!data.some(pr => pr.merged_at && pr.base.ref === 'main')) core.setFailed('Apply requires a merged PR into main');
  apply:
    if: ${{ false }}
    needs: merged-pr
    environment: terraform-production
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:

      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TF_APPLY_ROLE_ARN }}
          aws-region: us-east-1
      - name: Require migrated, locked state
        shell: bash
        env:
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          test -n "$STATE_BUCKET"
          cp ci/backend.tf.example backend.tf
          terraform init -input=false -lockfile=readonly -backend-config="bucket=$STATE_BUCKET" -backend-config="key=week13/terraform.tfstate" -backend-config="region=us-east-1" -backend-config="encrypt=true" -backend-config="use_lockfile=true"
          terraform state list > /tmp/state-addresses
          for address in module.rds.aws_db_instance.this aws_ecr_repository.ecs_app aws_security_group.ecs_app aws_security_group.alb; do
            grep -Fxq "$address" /tmp/state-addresses || { echo "Wrong or empty remote state: $address missing"; exit 1; }
          done
      - run: terraform validate -no-color

      - name: Plan the approved merge and enforce preservation
        shell: bash
        run: |
          terraform plan -input=false -lock-timeout=5m -no-color -out=approved.tfplan
          terraform show -json approved.tfplan | python3 scripts/review_plan.py
      - name: Apply the exact plan
        run: terraform apply -input=false -lock-timeout=5m approved.tfplan
      - name: Remove local plan
        if: always()
        run: rm -f approved.tfplan
